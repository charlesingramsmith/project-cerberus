<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Cerberus">
  <!-- The app icon: the logo's head (assets/logo.svg) with bolder lines, on a pastel
       pistachio tile. Used in the header (st.logo); assets/icon.png is a 512px copy for the
       browser tab. If the logo changes, redraw this and icon.png to match. -->
  <rect width="256" height="256" rx="56" fill="#BFD99A"/>
  <svg x="30" y="30" width="200" height="222" viewBox="0 0 180 200" overflow="hidden">
  <defs>
    <clipPath id="tile-ear">
      <path d="M112 70 C128 66 142 78 144 98 C147 122 142 146 130 156 C120 164 106 158 104 146 C101 128 104 104 110 84 Z"/>
    </clipPath>
  </defs>
  <g fill="none" stroke="#2E2A30" stroke-linecap="round" stroke-linejoin="round">
    <!-- ear shading: hand-hatched strokes, denser towards the back of the ear -->
    <g clip-path="url(#tile-ear)" stroke-width="1.82" stroke-opacity=".5">
      <path d="M104 96 L122 74"/><path d="M104 106 L130 74"/><path d="M104 116 L137 78"/>
      <path d="M103 127 L141 84"/><path d="M104 138 L144 93"/><path d="M107 147 L145 103"/>
      <path d="M112 154 L145 115"/><path d="M119 158 L144 128"/><path d="M127 158 L142 140"/>
      <path d="M118 150 L143 122" stroke-opacity=".35"/><path d="M110 140 L144 101" stroke-opacity=".35"/>
    </g>
    <!-- head and neck: long snout facing left, domed skull -->
    <path stroke-width="6.46" d="M158 192 C160 160 168 128 160 100 C154 78 140 60 118 56 C100 53 86 60 78 72 C66 80 46 86 26 92 C16 95 12 104 18 110 C26 118 44 120 62 122 C76 124 88 132 96 142 C104 156 108 174 108 192"/>
    <!-- floppy ear -->
    <path stroke-width="5.89" d="M112 70 C128 66 142 78 144 98 C147 122 142 146 130 156 C120 164 106 158 104 146 C101 128 104 104 110 84"/>
    <!-- brow and mouth -->
    <path stroke-width="4.37" d="M65 79 Q73 74 82 79"/>
    <path stroke-width="4.37" d="M23 110 C34 114 46 115 58 113"/>
    <!-- second, lighter pass: "gone over twice", running a little past the first -->
    <g stroke-width="1.82" stroke-opacity=".5">
      <path d="M157 188 C159 158 167 129 159 103 C153 81 139 61 118 58 C101 56 89 61 81 70"/>
      <path d="M76 75 C64 82 46 87 29 93 C21 96 16 101 19 107"/>
      <path d="M114 71 C130 69 141 82 142 101 C144 124 139 145 128 154"/>
      <path d="M61 124 C76 126 87 134 95 145 C102 158 106 174 107 189"/>
      <path d="M66 81 Q73 77 80 80"/>
    </g>
    <!-- a few quick shading strokes: under the jaw, along the snout, behind the cheek -->
    <g stroke-width="1.68" stroke-opacity=".38">
      <path d="M40 117 L48 119"/><path d="M50 118 L58 119"/>
      <path d="M44 92 L52 89"/><path d="M56 88 L63 85"/>
      <path d="M86 126 L92 131"/><path d="M90 136 L96 141"/>
      <path d="M150 120 L156 126"/><path d="M151 132 L157 137"/>
    </g>
    <!-- eye with a highlight, and the nose -->
    <ellipse cx="74" cy="88" rx="4.4" ry="4" fill="#2E2A30" stroke="none"/>
    <circle cx="75.6" cy="86.6" r="1.2" fill="#FAF8F5" stroke="none"/>
    <ellipse cx="20" cy="100" rx="7.6" ry="6.3" fill="#2E2A30" stroke="none"/>
    <path stroke-width="1.68" stroke-opacity=".5" d="M27 97 C30 101 30 104 27 107"/>
  </g>
  <path d="M108 174 C122 181 146 181 160 172" fill="none" stroke="#8A5A83" stroke-width="13.3" stroke-linecap="round"/>
  <path d="M110 179 C124 185 145 185 158 177" fill="none" stroke="#8A5A83" stroke-width="1.96" stroke-opacity=".55" stroke-linecap="round"/>
  </svg>
</svg>
