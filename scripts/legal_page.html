<!doctype html>
<!-- Template for the privacy and terms pages (site/privacy/, site/terms/). The text comes
     from legal/privacy.md and legal/terms.md: edit those, then run scripts/build_site.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} - Derlin</title>
<meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18171A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="icon" href="../icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
  <header class="legal-top">{{logo}}<a href="../">Derlin</a></header>
  <article class="legal">
{{body}}
  </article>
  <footer>
    <p><a href="../">Home</a> · <a href="../privacy/">Privacy</a> · <a href="../terms/">Terms</a> · <a href="{{app_url}}">Open the app</a></p>
  </footer>
</main>
</body>
</html>
