# Copy this file to .streamlit/secrets.toml and fill in your Supabase project's values.
# secrets.toml is git-ignored, so your keys never get committed.
#
# Find both values in Supabase: Project Settings > API Keys (and Data API for the URL).
# Use the PUBLISHABLE key (starts sb_publishable_) or the legacy "anon" key.
# NEVER use the secret / service_role key here: it bypasses all security rules.

[supabase]
url = "https://YOUR-PROJECT-REF.supabase.co"
key = "sb_publishable_..."
# Optional: where Google sign-in returns to. Normally worked out automatically.
# redirect_url = "https://project-cerberus.streamlit.app/"
# Optional: show "Continue with Apple" once Apple is set up (docs/apple-sign-in.md).
# apple_sign_in = true
#
# On Render there's no secrets file: the same values are the SUPABASE_URL, SUPABASE_KEY
# and SUPABASE_REDIRECT_URL environment variables (see render.yaml and docs/hosting.md).
